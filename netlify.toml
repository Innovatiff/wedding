# Netlify configuration for the Alam & Astrid wedding site.
# Static site: no build step, publish the repository root.

[build]
  publish = "."
  command = ""

# Long cache for fingerprint-free assets; HTML is always revalidated.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS, JS and HTML are left on Netlify's default (max-age=0, must-revalidate)
# so every deploy is picked up immediately; the ?v= tags in index.html bust
# any copy a browser already holds.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
